{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusGo · Ruta calculada</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="{% static 'core/css/base.css' %}">
<link rel="stylesheet" href="{% static 'core/css/components.css' %}">
<link rel="stylesheet" href="{% static 'core/css/layout.css' %}">
<link rel="stylesheet" href="{% static 'core/css/shell.css' %}">
<link rel="stylesheet" href="{% static 'core/css/route.css' %}">

<style>
.leaflet-map-route {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-xl);
    min-height: 500px;
    z-index: 1;
}
.leaflet-container { font-family: var(--font-family); }

/* Pin origen (verde) */
.pin-origen {
    background: var(--color-primary);
    width: 36px; height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid white;
    box-shadow: 0 4px 12px rgba(14, 158, 142, 0.5);
    display: flex; align-items: center; justify-content: center;
}
.pin-origen i { transform: rotate(45deg); color: white; font-size: 16px; }

/* Pin destino (naranja) */
.pin-destino {
    background: var(--color-secondary);
    width: 36px; height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid white;
    box-shadow: 0 4px 12px rgba(232, 114, 28, 0.5);
    display: flex; align-items: center; justify-content: center;
}
.pin-destino i { transform: rotate(45deg); color: white; font-size: 16px; }

/* Estado de carga / error */
.route-loading {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    padding: 60px 20px;
    color: var(--color-text-muted);
}
.route-loading i { font-size: 32px; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Banner Fase 1 / Beta */
.beta-banner {
    background: rgba(245, 197, 24, 0.12);
    border: 1.5px solid rgba(245, 197, 24, 0.4);
    color: #8a6b00;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px;
}
</style>
</head>

<body data-active="route">

<div data-mount="proto-nav"></div>

<div class="app-shell">
    <div data-mount="sidebar"></div>
    <div class="main-wrapper">

        <header class="topbar">
            <button class="mobile-menu-toggle"><i class="bi bi-list"></i></button>
            <div class="topbar-left">
                <a class="btn-icon" href="{% url 'core:map' %}"><i class="bi bi-arrow-left"></i></a>
                <div>
                    <div class="topbar-title">Ruta hacia tu destino</div>
                    <div class="topbar-subtitle" id="topbarSubtitle">Selecciona origen y destino</div>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn-icon" title="Compartir ruta"><i class="bi bi-share-fill"></i></button>
                <a class="btn-action-primary" href="{% url 'core:map' %}">
                    <i class="bi bi-map-fill"></i> Volver al mapa
                </a>
            </div>
        </header>

        <main class="page-content">

            <div class="breadcrumbs">
                <a href="{% url 'core:campus' %}">Campus</a>
                <span class="separator"><i class="bi bi-chevron-right"></i></span>
                <a href="{% url 'core:map' %}">ESCOM IPN</a>
                <span class="separator"><i class="bi bi-chevron-right"></i></span>
                <span class="current">Ruta</span>
            </div>

            <div class="route-layout">

                <!-- Panel izquierdo -->
                <div class="route-panel">

                    <!-- Buscadores -->
                    <div class="route-top-section">
                        <div class="buscador">

                            <div class="search-bar" style="position:relative;">
                                <span class="origin-dot"></span>
                                <input id="originInput" type="text" placeholder="Tu ubicación actual" autocomplete="off">
                                <button type="button" class="input-clear" data-target="originInput" aria-label="Borrar" tabindex="-1" onclick="var i=document.getElementById('originInput');i.value='';i.dispatchEvent(new Event('input'));i.focus();"><i class="bi bi-x-lg"></i></button>
                                <div id="originDropdown" class="search-dropdown"></div>
                            </div>

                            <div class="buscador-separator">
                                <div class="buscador-separator-line"></div>
                            </div>

                            <div class="search-bar" style="position:relative;">
                                <svg class="dest-pin" width="18" height="24" viewBox="0 0 20 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 0C4.477 0 0 4.477 0 10c0 7.5 10 16 10 16s10-8.5 10-16C20 4.477 15.523 0 10 0z" fill="var(--color-secondary)"/>
                                    <circle cx="10" cy="10" r="4" fill="white"/>
                                </svg>
                                <input id="destinationInput" type="text" placeholder="Escoger ubicación de destino" autocomplete="off">
                                <button type="button" class="input-clear" data-target="destinationInput" aria-label="Borrar" tabindex="-1" onclick="var i=document.getElementById('destinationInput');i.value='';i.dispatchEvent(new Event('input'));i.focus();"><i class="bi bi-x-lg"></i></button>
                                <div id="destinationDropdown" class="search-dropdown"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="route-stats">
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-clock-fill"></i></div>
                            <div class="route-stat-value" id="statTiempo">--</div>
                            <div class="route-stat-label">Tiempo</div>
                        </div>
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-signpost-2-fill"></i></div>
                            <div class="route-stat-value" id="statDistancia">--</div>
                            <div class="route-stat-label">Distancia</div>
                        </div>
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-person-walking"></i></div>
                            <div class="route-stat-value" id="statPasos">--</div>
                            <div class="route-stat-label">Pasos</div>
                        </div>
                    </div>

                    <!-- Modos -->
                    <div>
                        <div class="route-instructions-title">
                            <span>Modo de desplazamiento</span>
                        </div>
                        <div class="transport-modes">
                            <button class="transport-mode-btn active" data-mode="foot">
                                <i class="bi bi-person-walking"></i>
                                Caminando
                            </button>
                            <button class="transport-mode-btn" data-mode="bike">
                                <i class="bi bi-bicycle"></i>
                                Bicicleta
                            </button>
                            <button class="transport-mode-btn" data-mode="foot">
                                <i class="bi bi-universal-access"></i>
                                Accesible
                            </button>
                        </div>
                    </div>

                    <!-- Instrucciones -->
                    <div>
                        <div class="route-instructions-title">
                            <span><i class="bi bi-list-ol text-primary"></i> Instrucciones paso a paso</span>
                        </div>
                        <div class="route-steps" id="routeSteps">
                            <div class="instruction-step">
                                <div class="step-content">
                                    <div class="step-text route-empty-msg">
                                        <i class="bi bi-map"></i>
                                        Selecciona origen y destino para ver las instrucciones
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Acción -->
                    <div class="route-action">
                        <button id="btnIniciarRuta" class="btn-action-primary" style="width:100%;justify-content:center;padding:14px;font-size:14px;">
                            <i class="bi bi-play-fill"></i> Calcular ruta
                        </button>
                    </div>

                </div>

                <!-- Mapa Leaflet -->
                <div class="route-map-wrapper">
                    <div id="routeMap" class="route-leaflet-map"></div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="{% static 'core/js/nodes.js' %}"></script>
<script src="{% static 'core/js/locationMap.js' %}"></script>
<script src="{% static 'core/js/locations.js' %}"></script>
<script src="{% static 'core/js/route-render.js' %}"></script>
<script src="{% static 'core/js/shell.js' %}"></script>

</body>
</html>
