{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusGo · Ruta calculada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'core/css/base.css' %}">
<link rel="stylesheet" href="{% static 'core/css/components.css' %}">
<link rel="stylesheet" href="{% static 'core/css/layout.css' %}">
<link rel="stylesheet" href="{% static 'core/css/route.css' %}">
<link rel="stylesheet" href="{% static 'core/css/shell.css' %}">
</head>
<body data-active="route">

<div data-mount="proto-nav"></div>

<div class="app-shell">

    <div data-mount="sidebar"></div>

    <div class="main-wrapper">

        <header class="topbar">
            <button class="mobile-menu-toggle"><i class="bi bi-list"></i></button>
            <div class="topbar-left">
                <button class="btn-icon" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
                <div>
                    <div class="topbar-title">Ruta hacia tu destino</div>
                    <div class="topbar-subtitle" id="topbarSubtitle">Selecciona origen y destino</div>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn-icon" title="Compartir ruta"><i class="bi bi-share-fill"></i></button>
                <button class="btn-icon" title="Guardar ruta"><i class="bi bi-bookmark"></i></button>
            </div>
        </header>

        <main class="page-content">

            <div class="breadcrumbs">
                <a href="campus.html">Campus</a>
                <span class="separator"><i class="bi bi-chevron-right"></i></span>
                <a href="map.html">ESCOM IPN</a>
                <span class="separator"><i class="bi bi-chevron-right"></i></span>
                <span class="current">Ruta</span>
            </div>

            <div class="route-layout">

                <!-- Panel izquierdo con info de ruta -->
                <div class="route-panel">

                    <!-- Contenedor superior: buscadores -->
                    <div class="route-top-section">
                        <div class="buscador">

                            <!-- Buscador origen -->
                            <div class="search-bar" style="position:relative;">
                                <span class="origin-dot"></span>
                                <input id="originInput" type="text" placeholder="Tu ubicación actual" autocomplete="off">
                                <div id="originDropdown" class="search-dropdown"></div>
                            </div>

                            <!-- Separador -->
                            <div class="buscador-separator">
                                <div class="buscador-separator-line"></div>
                            </div>

                            <!-- Buscador destino -->
                            <div class="search-bar" style="position:relative;">
                                <svg class="dest-pin" width="18" height="24"
                                    viewBox="0 0 20 26" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 0C4.477 0 0 4.477 0 10c0 7.5 10 16 10 16s10-8.5 10-16C20 4.477 15.523 0 10 0z"
                                        fill="var(--color-secondary)"/>
                                    <circle cx="10" cy="10" r="4" fill="white"/>
                                </svg>
                                <input id="destinationInput" type="text" placeholder="Escoger ubicación de destino" autocomplete="off">
                                <div id="destinationDropdown" class="search-dropdown"></div>
                            </div>

                        </div>
                    </div>

                    <!-- Stats de ruta -->
                    <div class="route-stats">
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-clock-fill"></i></div>
                            <div class="route-stat-value" id="statTiempo">--</div>
                            <div class="route-stat-label">Tiempo</div>
                        </div>
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-signpost-2-fill"></i></div>
                            <div class="route-stat-value" id="statDistancia">--</div>
                            <div class="route-stat-label">Distancia</div>
                        </div>
                        <div class="route-stat-card">
                            <div class="route-stat-icon"><i class="bi bi-shoe-prints"></i></div>
                            <div class="route-stat-value" id="statPasos">--</div>
                            <div class="route-stat-label">Pasos</div>
                        </div>
                    </div>

                    <!-- Modos de transporte -->
                    <div>
                        <div class="route-instructions-title">
                            <span>Modo de desplazamiento</span>
                        </div>
                        <div class="transport-modes">
                            <button class="transport-mode-btn active">
                                <i class="bi bi-person-walking"></i>
                                Caminando
                            </button>
                            <button class="transport-mode-btn">
                                <i class="bi bi-bicycle"></i>
                                Bicicleta
                            </button>
                            <button class="transport-mode-btn">
                                <i class="bi bi-universal-access"></i>
                                Accesible
                            </button>
                        </div>
                    </div>

                    <!-- Instrucciones paso a paso -->
                    <div>
                        <div class="route-instructions-title">
                            <span><i class="bi bi-list-ol text-primary"></i> Instrucciones paso a paso</span>
                        </div>
                        <div class="route-steps" id="routeSteps">
                            <div class="instruction-step instruction-step--empty">
                                <div class="step-content">
                                    <div class="step-text" style="color:var(--color-text-muted); text-align:center; padding: 16px 0;">
                                        <i class="bi bi-map" style="font-size:1.4rem; display:block; margin-bottom:8px;"></i>
                                        Selecciona origen y destino para ver las instrucciones
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Acción -->
                    <div class="route-action">
                        <button id="btnIniciarRuta" class="btn-action-primary" style="width:100%; justify-content:center; padding:14px; font-size:14px;">
                            <i class="bi bi-play-fill"></i> Iniciar navegación guiada
                        </button>
                    </div>

                </div>

                <!-- Mapa con la ruta -->
                <div class="route-map-wrapper">
                    <div class="route-map-container" id="routeMapContainer">

                        <!-- Imagen base del campus -->
                        <img src="{% static 'core/img/campus_map_floor1.png' %}"
                             alt="Mapa del campus UAM Azcapotzalco"
                             class="route-map-img">

                        <!-- Capa SVG: aquí se dibujarán las rutas animadas -->
                        <svg class="route-map-svg"
                             id="routeSvg"
                             viewBox="0 0 900 900"
                             xmlns="http://www.w3.org/2000/svg">
                        </svg>

                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<script src="{% static 'core/js/nodes.js' %}"></script>
<script src="{% static 'core/js/graph.js' %}"></script>
<script src="{% static 'core/js/dijkstra.js' %}"></script>
<script src="{% static 'core/js/locationMap.js' %}"></script>
<script src="{% static 'core/js/locations.js' %}"></script>
<script src="{% static 'core/js/route-render.js' %}"></script>
<script src="{% static 'core/js/shell.js' %}"></script>

</body>
</html>
